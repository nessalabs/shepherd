name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SHEPHERD_PROBE_ABSENT: parent-only-sentinel

jobs:
  lint:
    timeout-minutes: 20
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin to the MSRV so clippy is reproducible and matches local development; newer stable
      # clippy adds lints that would otherwise fail CI non-deterministically.
      - uses: dtolnay/rust-toolchain@1.83.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  native-safety-lint:
    name: Native safety lint (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.83.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  ddd-architecture:
    timeout-minutes: 20
    name: DDD architecture fitness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: DDD boundary / purity / glossary
        working-directory: tools/ddd-arch-check
        run: node --experimental-strip-types check.ts

  domain-coverage:
    timeout-minutes: 20
    name: domain coverage (100% lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Enforce 100% line coverage for the pure domain
        run: cargo llvm-cov -p shepherd-domain --fail-under-lines 100

  test:
    timeout-minutes: 20
    name: contract + real platform backends + docs (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Contract + backend + doc tests
        run: cargo test --workspace

  linux-containment:
    timeout-minutes: 20
    name: Linux unprivileged lifecycle + capability honesty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Real-process integration tests
        run: cargo test -p shepherd-fixtures --test unix_integration -- --nocapture

  privileged-cgroup:
    timeout-minutes: 20
    name: privileged cgroup.kill + setsid + isolation + reap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build privileged tests as runner
        run: |
          cargo test -p shepherd-fixtures --test cgroup_integration --no-run --message-format=json > cgroup-artifacts.json
          cargo test -p shepherd-infra --lib --no-run --message-format=json > cgroup-backstop-artifacts.json
      - name: Exercise real cgroup v2 (fail closed)
        run: |
          set -euo pipefail
          test -f /sys/fs/cgroup/cgroup.controllers
          sudo mkdir /sys/fs/cgroup/shepherd-ci
          trap 'sudo rmdir /sys/fs/cgroup/shepherd-ci' EXIT
          test_bin=$(python3 -c 'import json; rows=[json.loads(line) for line in open("cgroup-artifacts.json")]; print(next(r["executable"] for r in rows if r.get("target", {}).get("name") == "cgroup_integration" and r.get("executable")))')
          test -n "$test_bin"
          sudo env SHEPHERD_CGROUP_ROOT=/sys/fs/cgroup/shepherd-ci "$test_bin" --ignored --test-threads=1 --nocapture
          backstop_bin=$(python3 -c 'import json; rows=[json.loads(line) for line in open("cgroup-backstop-artifacts.json")]; print(next(r["executable"] for r in rows if r.get("target", {}).get("name") == "shepherd_infra" and r.get("executable")))')
          test -n "$backstop_bin"
          sudo env SHEPHERD_CGROUP_ROOT=/sys/fs/cgroup/shepherd-ci "$backstop_bin" cgroup_backstop_tests --ignored --test-threads=1 --nocapture

  resource:
    timeout-minutes: 20
    name: cached stats + real resource observations (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p shepherd-fixtures --test resource_integration -- --nocapture
      - name: Aggregate usage, external roots, and scope isolation
        run: cargo test --locked -p shepherd-fixtures --test usage_integration --test observation_integration -- --nocapture
      - name: Concurrent application soak and resource bounds
        run: cargo test --locked -p shepherd-fixtures --test application_soak -- --nocapture
      - name: Accounting conversion and failure regressions
        run: "cargo test --locked -p shepherd-infra usage:: -- --nocapture"

  output-stress:
    timeout-minutes: 20
    name: binary output + bounded overflow + flood termination (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p shepherd-fixtures --test output_integration -- --nocapture

  properties-concurrency:
    timeout-minutes: 20
    name: generated invariants + registry and waiter interleavings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p shepherd --test properties --test adversarial --test scoped
      - run: cargo test -p shepherd-app --lib loom_
      - name: Model the actual waiter registration/publication lock
        env:
          RUSTFLAGS: --cfg shepherd_loom
        run: cargo test -p shepherd-infra --lib loom_

  leak-inspection:
    timeout-minutes: 20
    name: in-process FD or handle counts + owned zombie inspection (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p shepherd-fixtures --test leak_stress -- --nocapture

  machine-compatibility:
    name: Compatibility (${{ matrix.os }}, Rust ${{ matrix.rust }}, ${{ matrix.profile || 'debug' }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            rust: 1.83.0
            profile: --release
          - os: ubuntu-24.04-arm
            rust: stable
            profile: ''
          - os: macos-15-intel
            rust: stable
            profile: --release
          - os: windows-2022
            rust: 1.83.0
            profile: --release
          - os: windows-11-arm
            rust: stable
            profile: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: Record actual compiler and machine
        shell: bash
        run: |
          rustc -vV
          uname -a
      - name: Full workspace on alternate machines and optimized builds
        run: cargo test --workspace --locked ${{ matrix.profile }}

  linux-musl:
    name: Real Linux musl lifecycle and observations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Execute musl binaries (not just cross-compile)
        run: cargo test --workspace --locked --target x86_64-unknown-linux-musl

  workflow-validation:
    name: Validate workflow syntax and expressions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify external watchdog
        run: python3 -m unittest discover -s tools -p test_run_stress.py
      - name: Verify unsafe register and scanner
        run: |
          python3 -m unittest discover -s tools -p test_check_unsafe.py
          python3 tools/check_unsafe.py
      - name: Install pinned actionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          gh release download v1.7.12 --repo rhysd/actionlint --pattern actionlint_1.7.12_linux_amd64.tar.gz --dir "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/actionlint/actionlint_1.7.12_linux_amd64.tar.gz" -C "$RUNNER_TEMP/actionlint"
      - run: '"$RUNNER_TEMP/actionlint/actionlint" -shellcheck= -pyflakes='

  macos-accounting:
    name: macOS native accounting (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.83.0
      - uses: Swatinem/rust-cache@v2
      - name: CPU units, memory, flavor fallback, and access errors
        run: "cargo test --locked -p shepherd-infra usage::macos:: -- --nocapture"
      - name: Owned and external aggregates with lifecycle races
        run: cargo test --locked -p shepherd-fixtures --test usage_integration --test observation_integration -- --nocapture
      - name: Native live, zombie, and reaped query contract
        run: |
          clang -Wall -Wextra -Werror -O2 docs/research/macos-rusage-probe.c -o /tmp/shepherd-rusage-probe
          /tmp/shepherd-rusage-probe
