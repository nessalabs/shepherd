name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin to the MSRV so clippy is reproducible and matches local development; newer stable
      # clippy adds lints that would otherwise fail CI non-deterministically.
      - uses: dtolnay/rust-toolchain@1.83.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  ddd-architecture:
    name: DDD architecture fitness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: DDD boundary / purity / glossary
        working-directory: tools/ddd-arch-check
        run: node --experimental-strip-types check.ts

  domain-coverage:
    name: domain coverage (100% lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Enforce 100% line coverage for the pure domain
        run: cargo llvm-cov -p shepherd-domain --fail-under-lines 100

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Contract + backend + doc tests
        run: cargo test --workspace

  linux-containment:
    name: Linux unprivileged lifecycle + capability honesty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Real-process integration tests
        run: cargo test -p shepherd-fixtures --test unix_integration -- --nocapture

  privileged-cgroup:
    name: privileged cgroup.kill + setsid + isolation + reap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build privileged tests as runner
        run: cargo test -p shepherd-fixtures --test cgroup_integration --no-run
      - name: Exercise real cgroup v2 (fail closed)
        run: |
          set -euo pipefail
          test -f /sys/fs/cgroup/cgroup.controllers
          sudo mkdir /sys/fs/cgroup/shepherd-ci
          trap 'sudo rmdir /sys/fs/cgroup/shepherd-ci' EXIT
          test_bin=$(find target/debug/deps -maxdepth 1 -name 'cgroup_integration-*' -type f -executable | head -n 1)
          test -n "$test_bin"
          sudo env SHEPHERD_CGROUP_ROOT=/sys/fs/cgroup/shepherd-ci "$test_bin" --ignored --test-threads=1 --nocapture

  resource:
    name: cached stats + real resource observations (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p shepherd-fixtures --test resource_integration -- --nocapture

  output-stress:
    name: binary output + bounded overflow + flood termination (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p shepherd-fixtures --test output_integration -- --nocapture
