name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  ddd-architecture:
    name: DDD architecture fitness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: DDD boundary / purity / glossary
        working-directory: tools/ddd-arch-check
        run: node --experimental-strip-types check.ts

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Contract + backend + doc tests
        run: cargo test --workspace

  linux-containment:
    name: Linux containment (process group; cgroup probe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Probe cgroup v2 availability
        run: |
          echo "cgroup v2 mount:"; (mount | grep cgroup2 || echo "  none")
          echo "cgroup.controllers:"; (cat /sys/fs/cgroup/cgroup.controllers 2>/dev/null || echo "  unavailable")
          echo "NOTE: full cgroup.kill containment tests land with the cgroup v2 backend (Phase 2);"
          echo "this job currently validates the POSIX process-group backend on Linux."
      - name: Real-process integration tests
        run: cargo test -p shepherd-fixtures --test unix_integration -- --nocapture
