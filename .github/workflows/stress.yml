name: Long mixed lifecycle and resource stress
on:
  workflow_dispatch:
    inputs:
      iterations:
        description: "Mixed cycles per OS/runtime (6..100000)"
        required: false
        default: "2000"
      seed:
        description: "Reproducible scenario seed (unsigned integer)"
        required: false
        default: "42"
      machines:
        description: "Machine set (Windows subset helps reproduce handle failures)"
        type: choice
        options: [all, windows, macos]
        default: all
      runtime:
        description: "Runtime subset"
        type: choice
        options: [both, current, multi]
        default: both
# Run on demand; PR CI executes the bounded version on both runtime flavors.
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
jobs:
  stress:
    name: Mixed stress (${{ matrix.os }}, ${{ matrix.runtime }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.machines == 'windows' && '["windows-2022","windows-11-arm"]' || inputs.machines == 'macos' && '["macos-15","macos-15-intel"]' || '["ubuntu-24.04","ubuntu-24.04-arm","macos-15","macos-15-intel","windows-2022","windows-11-arm"]') }}
        runtime: ${{ fromJSON(inputs.runtime == 'current' && '["current"]' || inputs.runtime == 'multi' && '["multi"]' || '["current","multi"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify watchdog failure handling
        run: python -m unittest discover -s tools -p test_run_stress.py
      - name: Record machine and compiler
        shell: bash
        run: |
          rustc -vV
          uname -a
      - name: Mixed lifecycle with resource assertions
        shell: bash
        env:
          SHEPHERD_STRESS_ITERATIONS: ${{ inputs.iterations }}
          SHEPHERD_STRESS_SEED: ${{ inputs.seed }}
          SHEPHERD_STRESS_RUNTIME: ${{ matrix.runtime }}
        run: |
          python tools/run-stress.py --log stress.log -- cargo test --locked -p shepherd-fixtures --test leak_stress long_create_kill -- --ignored --nocapture
      - name: Larger generated traces and cancellation races
        shell: bash
        env:
          PROPTEST_CASES: '512'
        run: |
          set -o pipefail
          cargo test --locked -p shepherd --test adversarial --test scoped --test properties 2>&1 | tee properties.log
      - name: Retain failures, seeds and resource counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-${{ matrix.os }}-${{ matrix.runtime }}
          path: |
            stress.log
            stress.diagnostics.txt
            properties.log
            **/*.proptest-regressions
            **/proptest-regressions/**
          if-no-files-found: warn
