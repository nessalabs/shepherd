name: Long lifecycle resource and cancellation stress
on:
  workflow_dispatch:
    inputs:
      iterations:
        description: "Create/capture/kill/reap cycles inside each test process"
        required: false
        default: "2000"
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
jobs:
  stress:
    name: FD or handle accounting + owned-zombie inspection (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Repeated lifecycle in one process with resource assertions
        env:
          SHEPHERD_STRESS_ITERATIONS: ${{ inputs.iterations }}
        run: cargo test -p shepherd-fixtures --test leak_stress long_create_kill -- --ignored --nocapture
      - name: Cancellation, races, and injected failures
        run: cargo test -p shepherd --test adversarial --test scoped --test properties
