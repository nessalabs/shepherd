[package]
name = "shepherd-fixtures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Pathological helper binaries used by Shepherd's test suite. Not published."

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies]
shepherd-test-support = { path = "../crates/shepherd-test-support" }
shepherd = { path = "../crates/shepherd" }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(windows)'.dev-dependencies]
ntapi = "0.4.3"
