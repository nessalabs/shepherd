[workspace]
resolver = "2"
members = [
    "crates/shepherd-domain",
    "crates/shepherd-app",
    "crates/shepherd-infra",
    "crates/shepherd",
    "fixtures",
    "crates/shepherd-test-support",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "Apache-2.0"
repository = "https://github.com/nessalabs/shepherd"

[workspace.dependencies]
shepherd-domain = { path = "crates/shepherd-domain" }
shepherd-app = { path = "crates/shepherd-app" }
shepherd-infra = { path = "crates/shepherd-infra" }
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(shepherd_loom)'] }
