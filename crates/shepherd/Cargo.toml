[package]
name = "shepherd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reusable, production-quality process supervision library."

[features]
default = ["blocking"]
# Synchronous entry point that owns or borrows a Tokio runtime. The async
# ProcessSupervisor surface is always available; this flag only gates
# shepherd::blocking.
blocking = []

[dependencies]
shepherd-domain = { workspace = true }
shepherd-app = { workspace = true }
shepherd-infra = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
shepherd-test-support = { path = "../shepherd-test-support" }
proptest = { version = "=1.6.0", default-features = false, features = ["std"] }
tokio = { workspace = true, features = ["test-util", "rt-multi-thread", "macros"] }
async-trait = "0.1"
shepherd-domain = { workspace = true }

[[test]]
name = "blocking"
required-features = ["blocking"]

[lints]
workspace = true
