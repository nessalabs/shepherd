[package]
name = "shepherd-infra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shepherd infrastructure adapters implementing the application ports."

[dependencies]
sysinfo = { version = "0.33.1", default-features = false, features = ["system"] }
shepherd-domain = { workspace = true }
shepherd-app = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = "0.1"
tokio = { workspace = true, features = ["signal"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process", "feature", "fs", "resource"] }
libc = "0.2"

[dev-dependencies]
shepherd-test-support = { path = "../shepherd-test-support" }
loom = "0.7"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14"
mach2 = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus"] }
